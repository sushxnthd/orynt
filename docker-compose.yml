services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orynt
      POSTGRES_PASSWORD: orynt
      POSTGRES_DB: orynt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orynt -d orynt"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orynt_pg:/var/lib/postgresql/data

volumes:
  orynt_pg:
